<!doctype html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>to do list</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="aurora" id="aurora">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="spot" id="spot"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>

<!-- Dev tools (left side) -->
<div class="dev" id="dev">
  <button type="button" class="devswitch" id="devSwitch" role="switch" aria-checked="false" aria-label="Dev mode"><span class="knob"></span></button>
  <span class="dev-label">Dev mode</span>
  <button type="button" class="devsky" id="btnDevSky" hidden title="Open the dev constellation (skips the 7-day lock)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.3 5.1 5.5.6-4.1 3.7 1.2 5.5L12 15.6 7.1 18.4l1.2-5.5L4.2 9.2l5.5-.6z"/></svg>
    <span>Dev constellation</span>
  </button>
</div>

<!-- Floating tools -->
<nav class="toolbar" aria-label="Tools">
  <button type="button" class="tbtn" id="btnFocus" aria-pressed="false" aria-label="One-thing mode" title="One-thing mode">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.2" class="fill"/></svg>
  </button>
  <button type="button" class="tbtn" id="btnSky" aria-label="Constellations" title="Constellations">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.3 5.1 5.5.6-4.1 3.7 1.2 5.5L12 15.6 7.1 18.4l1.2-5.5L4.2 9.2l5.5-.6z"/></svg>
  </button>
  <button type="button" class="tbtn" id="btnSound" aria-pressed="true" aria-label="Completion sounds" title="Sound on">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9.5h3.2L11.5 6v12l-4.3-3.5H4z"/>
      <path class="waves" d="M15 9.2a4 4 0 010 5.6M17.6 6.8a7.4 7.4 0 010 10.4"/>
      <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/>
    </svg>
  </button>
  <div class="theme-wrap">
    <button type="button" class="tbtn" id="btnTheme" aria-haspopup="true" aria-expanded="false" aria-label="Themes" title="Themes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 000 16z" class="fill"/></svg>
    </button>
    <div class="theme-pop" id="themePop" role="menu" aria-label="Themes" hidden>
      <button type="button" class="topt" role="menuitemradio" data-theme="midnight"><i class="sw sw-midnight"></i>Midnight</button>
      <button type="button" class="topt" role="menuitemradio" data-theme="ember"><i class="sw sw-ember"></i>Ember</button>
      <button type="button" class="topt" role="menuitemradio" data-theme="forest"><i class="sw sw-forest"></i>Forest</button>
      <button type="button" class="topt" role="menuitemradio" data-theme="mono"><i class="sw sw-mono"></i>Mono</button>
    </div>
  </div>
</nav>

<main class="stage" id="stage">
  <header class="head">
    <h1>today</h1>
    <p class="date" id="date"></p>
    <div class="progress" aria-hidden="true"><span id="bar"></span></div>
  </header>

  <nav class="lists" id="lists" aria-label="Lists"></nav>

  <div class="field" id="field">
    <div class="glow" aria-hidden="true"></div>
    <input id="input" type="text" placeholder="What needs doing?" autocomplete="off" autocapitalize="sentences" maxlength="140" aria-label="Add a task">
    <kbd class="hint" aria-hidden="true">Enter</kbd>
  </div>

  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden></p>

  <footer class="foot is-hidden" id="foot">
    <span id="count" aria-live="polite"></span>
    <div class="filters" id="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" class="on" aria-pressed="true">All</button>
      <button type="button" data-filter="open" aria-pressed="false">Open</button>
      <button type="button" data-filter="done" aria-pressed="false">Done</button>
    </div>
    <button type="button" class="clear is-hidden" id="clear">Clear done</button>
  </footer>
</main>

<!-- One-thing mode -->
<section class="focus" id="focus" aria-label="One-thing mode" hidden>
  <div class="f-card" id="fCard"></div>
</section>

<!-- Constellations -->
<section class="sky" id="sky" role="dialog" aria-modal="true" aria-label="Constellations" hidden>
  <div class="sky-inner">
    <button type="button" class="sky-close" id="skyClose" aria-label="Close constellations">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
    <div id="skyBody"></div>
  </div>
</section>

<!-- New / edit list -->
<section class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" hidden>
  <div class="dlg-card">
    <h2 id="dlgTitle">New list</h2>
    <label class="fld"><span>List name</span>
      <input id="dlgName" type="text" maxlength="40" autocomplete="off" placeholder="Thesis, Personal, Project...">
    </label>
    <label class="fld"><span>Constellation name <em>(optional)</em></span>
      <input id="dlgCName" type="text" maxlength="40" autocomplete="off" placeholder="Leave empty for an auto name each week">
    </label>
    <div class="fld"><span>Star colors</span><div class="swatches" id="dlgColors" role="radiogroup" aria-label="Star colors"></div></div>
    <div class="fld"><span>Shape</span><div class="shapes" id="dlgShapes" role="radiogroup" aria-label="Constellation shape"></div></div>
    <div class="dlg-prev" id="dlgPrev" aria-hidden="true"></div>
    <div class="dlg-actions">
      <button type="button" class="dlg-del" id="dlgDelete" hidden>Delete list</button>
      <span class="grow"></span>
      <button type="button" class="ghost-btn" id="dlgCancel">Cancel</button>
      <button type="button" class="solid-btn" id="dlgSave">Create</button>
    </div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
