<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b73ff"/>
      <stop offset="0.55" stop-color="#3fd6c6"/>
      <stop offset="1" stop-color="#ff6f9c"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d6ee"/>
    </linearGradient>
    <radialGradient id="auroraA" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#6b73ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6b73ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="0.85" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#3fd6c6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3fd6c6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraC" cx="0.95" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#ff6f9c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6f9c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#08080e"/>
    <rect width="512" height="512" fill="url(#auroraA)"/>
    <rect width="512" height="512" fill="url(#auroraB)"/>
    <rect width="512" height="512" fill="url(#auroraC)"/>

    <!-- soft glow behind the ring -->
    <circle cx="256" cy="256" r="136" fill="none" stroke="url(#ring)" stroke-width="40" opacity="0.7" filter="url(#glow)"/>

    <!-- ring -->
    <circle cx="256" cy="256" r="136" fill="none" stroke="url(#ring)" stroke-width="34"/>

    <!-- checkmark -->
    <path d="M196 262 L240 306 L322 212" fill="none" stroke="url(#check)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="1" y="1" width="510" height="510" rx="115" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
